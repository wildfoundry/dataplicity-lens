[package]
name = "lens-top"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A coherent, modern Linux and macOS process explorer"
build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
lens-core = { version = "=0.3.4", path = "../../crates/core" }
lens-diagnostics = { version = "=0.3.4", path = "../../crates/diagnostics" }
lens-history = { version = "=0.3.4", path = "../../crates/history" }
lens-model = { version = "=0.3.4", path = "../../crates/model" }
lens-output = { version = "=0.3.4", path = "../../crates/output" }
lens-ui = { version = "=0.3.4", path = "../../crates/ui" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lens-platform-linux = { version = "=0.3.4", path = "../../crates/platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
lens-platform-macos = { version = "=0.3.4", path = "../../crates/platform-macos" }

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[[bench]]
name = "process_pipeline"
harness = false

[dev-dependencies.criterion]
workspace = true
