lens-core = { path = "../../crates/core" }
lens-model = { path = "../../crates/model" }
lens-output = { path = "../../crates/output" }
lens-platform-linux = { path = "../../crates/platform-linux" }
lens-ui = { path = "../../crates/ui" }
