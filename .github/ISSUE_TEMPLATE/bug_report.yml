name: Bug report
description: Report incorrect behaviour or a crash
title: "[bug] "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, expected result and actual result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Lens version, Linux distribution, kernel, architecture and terminal.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal steps or a safe fixture that reproduces the issue.
