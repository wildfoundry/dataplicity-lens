name: Apply pinned rustfmt

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo +1.85.1 fmt --all
      - name: Commit deterministic formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all ':!.github/workflows'
          git commit -m "Format first release workspace"
          git push origin HEAD:agent/build-first-release
