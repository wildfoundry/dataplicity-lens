name: Bootstrap first release source

on:
  push:
    branches:
      - agent/build-first-release
    paths:
      - .github/workflows/bootstrap-first-release.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-first-release
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xzpart00 .bootstrap/xzpart01 .bootstrap/xzpart02 .bootstrap/xzpart03 > /tmp/dataplicity-lens.tar.xz.b64
          base64 --decode /tmp/dataplicity-lens.tar.xz.b64 > /tmp/dataplicity-lens.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          tar -xJf /tmp/dataplicity-lens.tar.xz -C .

      - name: Generate locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 generate-lockfile

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Build first Dataplicity Lens release"
          git push origin HEAD:agent/build-first-release
