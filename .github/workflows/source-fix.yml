name: Apply source corrections

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Apply reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/io::Error::new(io::ErrorKind::Other, error)/io::Error::other(error)/' crates/output/src/lib.rs
          cargo fmt --all
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all ':!.github/workflows'
          git commit -m "Fix first release lint findings"
          git push origin HEAD:agent/build-first-release
