name: Main development artifacts

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/main-build.yml
      - scripts/package-suite.sh
      - packaging/**
      - crates/system/src/power.rs

permissions:
  contents: read

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }} development artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
            cross: false
          - name: ARM64
            runner: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
            cross: false
          - name: Raspberry-Pi-OS-32-bit
            runner: ubuntu-24.04
            gnu_target: arm-unknown-linux-gnueabihf
            musl_target: arm-unknown-linux-musleabihf
            deb_arch: armhf
            rpm_arch: armv6hl
            cross: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Derive development package version from source
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), version
          commit = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', commit), commit
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write(f'VERSION={version}+dev.{commit[:12]}\n')
          Path('SOURCE_COMMIT').write_text(commit + '\n')
          PY
      - name: Activate pinned Rust toolchain and install package tools
        run: |
          rustup show active-toolchain
          sudo apt-get update
          sudo apt-get install --yes musl-tools rpm ruby-dev
          sudo gem install --no-document fpm
      - name: Install cross for Raspberry Pi builds
        if: matrix.cross
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross@0.2.5
      - name: Build GNU and musl binaries
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.gnu_target }}" --workspace
            cross build --release --locked --target "${{ matrix.musl_target }}" --workspace
          else
            cargo build --release --locked --target "${{ matrix.gnu_target }}" --workspace
            cargo build --release --locked --target "${{ matrix.musl_target }}" --workspace
          fi
          find "target/${{ matrix.gnu_target }}/release" -maxdepth 1 -type f -perm -111 -exec strip {} \; || true
          find "target/${{ matrix.musl_target }}/release" -maxdepth 1 -type f -perm -111 -exec strip {} \; || true
      - name: Generate man page and completions
        run: |
          cargo build --release --locked --workspace
          scripts/generate-assets.sh target/release/lens-top dist/generated
      - name: Package GNU archive
        env:
          TARGET: ${{ matrix.gnu_target }}
          PACKAGE_NATIVE: "false"
        run: scripts/package-suite.sh
      - name: Package portable musl archive, Debian and RPM packages
        env:
          TARGET: ${{ matrix.musl_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          NATIVE_OUTPUT_DIR: dist/${{ matrix.gnu_target }}
        run: scripts/package-suite.sh
      - name: Smoke-test binaries and native packages
        if: ${{ !matrix.cross }}
        env:
          GNU_TARGET: ${{ matrix.gnu_target }}
          MUSL_TARGET: ${{ matrix.musl_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          scripts/smoke-suite.sh "target/${GNU_TARGET}/release"
          scripts/smoke-suite.sh "target/${MUSL_TARGET}/release"
          sudo apt-get install --yes "./dist/${GNU_TARGET}/dataplicity-lens_${VERSION}_${DEB_ARCH}.deb"
          scripts/smoke-suite.sh /usr/bin
          sudo apt-get remove --yes dataplicity-lens
          sudo rpm --install --nodeps "dist/${GNU_TARGET}/dataplicity-lens-${VERSION}-1.${RPM_ARCH}.rpm"
          scripts/smoke-suite.sh /usr/bin
          sudo rpm --erase dataplicity-lens
      - name: Smoke-test Raspberry Pi binaries and inspect packages
        if: matrix.cross
        env:
          GNU_TARGET: ${{ matrix.gnu_target }}
          MUSL_TARGET: ${{ matrix.musl_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          for target in "$GNU_TARGET" "$MUSL_TARGET"; do
            for binary in lens lens-top lens-services lens-containers lens-logs lens-disk lens-net lens-hardware lens-system lens-health; do
              cross run --release --locked --target "$target" --bin "$binary" -- --demo --json > smoke-output.json
              grep -q '"schema_version": "2"' smoke-output.json
            done
          done
          dpkg-deb --contents "./dist/${GNU_TARGET}/dataplicity-lens_${VERSION}_${DEB_ARCH}.deb" > deb-contents.txt
          rpm --query --package --list "dist/${GNU_TARGET}/dataplicity-lens-${VERSION}-1.${RPM_ARCH}.rpm" > rpm-contents.txt
          for binary in lens lens-top lens-services lens-containers lens-logs lens-disk lens-net lens-hardware lens-system lens-health; do
            grep -q "/usr/bin/${binary}$" deb-contents.txt
            grep -q "/usr/bin/${binary}$" rpm-contents.txt
          done
      - name: Generate checksums
        run: |
          cp SOURCE_COMMIT dist/SOURCE_COMMIT
          find "dist/${{ matrix.gnu_target }}" "dist/${{ matrix.musl_target }}" -type f -print0 | sort -z | xargs -0 sha256sum > "dist/SHA256SUMS-${{ matrix.name }}"
      - name: Upload retained development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dataplicity-lens-main-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/${{ matrix.gnu_target }}/*
            dist/${{ matrix.musl_target }}/*
            dist/SHA256SUMS-${{ matrix.name }}
            dist/SOURCE_COMMIT
          retention-days: 14
          if-no-files-found: error

  attest:
    name: Attest ${{ matrix.name }} development artifacts
    needs: build
    # Forks can exercise packaging, but cannot mint repository attestations.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [x86-64, ARM64, Raspberry-Pi-OS-32-bit]
    steps:
      - name: Download artifacts from this build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dataplicity-lens-main-${{ matrix.name }}-${{ github.sha }}
          path: dist
      - name: Verify build checksums and source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(cat dist/SOURCE_COMMIT)" = "$EXPECTED_COMMIT"
          sha256sum --check "dist/SHA256SUMS-${{ matrix.name }}"
      - name: Sign build provenance in GitHub Actions
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
            dist/SOURCE_COMMIT
            dist/SHA256SUMS-${{ matrix.name }}
      - name: Retain signed provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.sigstore.json
      - name: Upload attested development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dataplicity-lens-main-attested-${{ matrix.name }}-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
