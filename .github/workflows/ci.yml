name: CI

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-source-correction
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  correct:
    name: Apply reviewed source correction
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Correct sampling and demo fixture lint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/lens-top/src/main.rs')
          text = path.read_text()
          old = '''    let mut snapshot = sampler.collect()?;
              if args.demo {
                  snapshot = sampler.collect()?;
              } else {
                  thread::sleep(effective.interval.min(Duration::from_millis(250)));
                  snapshot = sampler.collect()?;
              }
          '''
          new = '''    let _initial = sampler.collect()?;
              if !args.demo {
                  thread::sleep(effective.interval.min(Duration::from_millis(250)));
              }
              let mut snapshot = sampler.collect()?;
          '''
          if old not in text:
              raise SystemExit('expected sampling block not found')
          path.write_text(text.replace(old, new))

          path = Path('apps/lens-top/src/demo.rs')
          text = path.read_text()
          marker = 'fn process(\n'
          if marker not in text:
              raise SystemExit('process helper not found')
          path.write_text(text.replace(marker, '#[allow(clippy::too_many_arguments)]\nfn process(\n', 1))
          PY
          cargo fmt --all
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/lens-top/src/main.rs apps/lens-top/src/demo.rs
          git commit -m "Fix sampling and demo fixture lint"
          git push origin HEAD:agent/build-first-release
