name: CI

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-security-tool-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Update security tool pins
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Update cargo-deny in CI and release workflows
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/cargo-deny --version 0\.16\.4/cargo-deny --version 0.20.2/g' .github/workflows/ci.yml .github/workflows/release.yml
          git diff --check
      - name: Commit toolchain update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml .github/workflows/release.yml
          git commit -m "Update cargo-deny for CVSS 4.0 advisories"
          git push origin HEAD:agent/build-first-release
