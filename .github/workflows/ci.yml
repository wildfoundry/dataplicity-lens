name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lockfile:
    name: Locked dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Verify committed lockfile
        run: |
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

  quality:
    name: Format, lint, test and document
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run unit, fixture, snapshot and integration tests
        run: cargo test --workspace --all-features --locked
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Build release workspace
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: cargo build --workspace --all-features --release --locked
      - run: scripts/smoke-suite.sh target/release

  security:
    name: Licences and advisories
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install security tools
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit

  target-builds:
    name: Build ${{ matrix.target }}
    needs: lockfile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabihf
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Install cross
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cross@0.2.5
      - name: Build release target from clean source
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: cross build --release --locked --target "${{ matrix.target }}" --workspace

  macos-native:
    name: macOS ${{ matrix.arch }} native suite
    needs: lockfile
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            runner: macos-15
          - arch: Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - run: cargo test --workspace --all-features --locked
      - name: Build and smoke-test native macOS suite
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions macOS
        run: |
          cargo build --workspace --all-features --release --locked
          scripts/smoke-suite.sh target/release
          target/release/lens-top --once --json > /tmp/lens-macos.json
          grep -q '"hostname"' /tmp/lens-macos.json
          grep -q '"processes"' /tmp/lens-macos.json
      - name: Install and test through Homebrew
        if: matrix.arch == 'Apple-Silicon'
        run: scripts/test-homebrew-local.sh
      - name: Verify published Homebrew formula generation
        if: matrix.arch == 'Apple-Silicon'
        run: scripts/test-homebrew-formula-generation.sh
