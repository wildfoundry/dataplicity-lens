name: CI

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-source-correction
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  correct:
    name: Apply reviewed source correction
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Remove stale UI imports
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/use lens_core::{GroupMode, SortDirection, SortKey};/use lens_core::{SortDirection, SortKey};/' crates/ui/src/render.rs
          sed -i 's/use lens_model::{EntityId, Process, Severity};/use lens_model::{EntityId, Severity};/' crates/ui/src/render.rs
          cargo fmt --all
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ui/src/render.rs
          git commit -m "Remove stale UI imports"
          git push origin HEAD:agent/build-first-release
