name: CI

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-output-correction
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  correct:
    name: Preserve serializer I/O error kinds
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/build-first-release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Correct JSON output error mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/output/src/lib.rs')
          text = path.read_text()
          old_pretty = '        Err(error) if error.is_io() => Err(io::Error::other(error)),\n'
          new_pretty = '''        Err(error) if error.is_io() => Err(io::Error::new(\n            error.io_error_kind().unwrap_or(io::ErrorKind::Other),\n            error,\n        )),\n'''
          old_line = '        .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))?;\n'
          new_line = '''        .map_err(|error| {\n            let kind = error\n                .io_error_kind()\n                .unwrap_or(io::ErrorKind::InvalidData);\n            io::Error::new(kind, error)\n        })?;\n'''
          if old_pretty not in text:
              raise SystemExit('expected pretty JSON mapping not found')
          if old_line not in text:
              raise SystemExit('expected JSONL mapping not found')
          path.write_text(text.replace(old_pretty, new_pretty).replace(old_line, new_line))
          PY
          cargo fmt --all
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/output/src/lib.rs
          git commit -m "Preserve JSON output I/O error kinds"
          git push origin HEAD:agent/build-first-release
