name: Regenerate dependency lockfile

on:
  push:
    branches: [agent/build-first-release]
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

concurrency:
  group: regenerate-lens-lockfile
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lockfile:
    name: Generate and commit Cargo.lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/build-first-release
          fetch-depth: 0
      - name: Activate pinned toolchain
        run: rustup show active-toolchain
      - name: Resolve updated dependency graph
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps >/dev/null
          git diff --check
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git commit -m "Refresh dependency lockfile"
          git push origin HEAD:agent/build-first-release
