name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lockfile:
    name: Locked dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Generate lockfile
        run: cargo +1.85.1 generate-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          retention-days: 2
          if-no-files-found: error
      - name: Verify lockfile is committed and current
        run: git diff --exit-code -- Cargo.lock

  quality:
    name: Format, lint, test and document
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.85.1 fmt --all -- --check
      - name: Run Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run unit, fixture, snapshot and integration tests
        run: cargo +1.85.1 test --workspace --all-features --locked
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.1 doc --workspace --all-features --no-deps --locked
      - name: Build release workspace
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: cargo +1.85.1 build --workspace --all-features --release --locked
      - name: Smoke-test release binary
        run: scripts/smoke-test.sh target/release/lens-top

  security:
    name: Licences and advisories
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Install security tools
        run: |
          cargo +1.85.1 install cargo-deny --version 0.16.4 --locked
          cargo +1.85.1 install cargo-audit --version 0.21.2 --locked
      - name: Check dependency licences, sources and duplicates
        run: cargo deny check
      - name: Check RustSec advisories
        run: cargo audit

  target-builds:
    name: Build ${{ matrix.target }}
    needs: lockfile
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --target "${{ matrix.target }}"
      - name: Install cross
        run: cargo +1.85.1 install cross --version 0.2.5 --locked
      - name: Build release target from clean source
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: cross +1.85.1 build --release --locked --target "${{ matrix.target }}" -p lens-top
