name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
      dry_run:
        description: Build and validate without publishing
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[workspace.package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version = / { gsub(/[" ]/, "", $3); print $3; exit }
          ' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Could not read workspace version" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            dry_run=false
            git fetch origin main
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            dry_run=true
          else
            tag="v${version}"
            dry_run=true
          fi
          [[ "$tag" == "v${version}" ]] || {
            echo "Tag $tag does not match workspace version v${version}" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

  validate:
    name: Complete test and security suite
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Install security tools
        run: |
          cargo +1.85.1 install cargo-deny --version 0.16.4 --locked
          cargo +1.85.1 install cargo-audit --version 0.21.2 --locked
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.85.1 test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.1 doc --workspace --all-features --no-deps --locked
      - run: cargo deny check
      - run: cargo audit

  build:
    name: Build and package ${{ matrix.name }}
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            gnu_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            deb_arch: amd64
            rpm_arch: x86_64
          - name: ARM64
            runner: ubuntu-24.04-arm
            gnu_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out clean tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain and package tools
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target "${{ matrix.gnu_target }},${{ matrix.musl_target }}"
          sudo apt-get update
          sudo apt-get install --yes musl-tools rpm ruby-dev
          sudo gem install --no-document fpm
          cargo +1.85.1 install cargo-cyclonedx --version 0.5.7 --locked
      - name: Build clean release binaries
        env:
          LENS_GIT_SHA: ${{ github.sha }}
          LENS_BUILT_BY: GitHub Actions
        run: |
          cargo +1.85.1 clean
          cargo +1.85.1 build --release --locked --target "${{ matrix.gnu_target }}" -p lens-top
          cargo +1.85.1 build --release --locked --target "${{ matrix.musl_target }}" -p lens-top
          strip "target/${{ matrix.gnu_target }}/release/lens-top" || true
          strip "target/${{ matrix.musl_target }}/release/lens-top" || true
      - name: Generate man page and shell completions
        run: scripts/generate-assets.sh "target/${{ matrix.gnu_target }}/release/lens-top" dist/generated
      - name: Build GNU archive, Debian and RPM packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.gnu_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: scripts/package.sh
      - name: Build musl archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.musl_target }}
        run: |
          set -euo pipefail
          root="lens-top-v${VERSION}-${TARGET}"
          out="dist/${TARGET}"
          mkdir -p "$out/$root/completions"
          install -m 0755 "target/${TARGET}/release/lens-top" "$out/$root/lens-top"
          install -m 0644 LICENSE README.md "$out/$root/"
          install -m 0644 dist/generated/man/lens-top.1 "$out/$root/lens-top.1"
          install -m 0644 dist/generated/completions/* "$out/$root/completions/"
          tar -C "$out" -czf "$out/${root}.tar.gz" "$root"
          rm -rf "$out/$root"
      - name: Install and smoke-test generated packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GNU_TARGET: ${{ matrix.gnu_target }}
          MUSL_TARGET: ${{ matrix.musl_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          scripts/smoke-test.sh "target/${GNU_TARGET}/release/lens-top"
          scripts/smoke-test.sh "target/${MUSL_TARGET}/release/lens-top"
          sudo apt-get install --yes "./dist/${GNU_TARGET}/lens-top_${VERSION}_${DEB_ARCH}.deb"
          lens-top --version
          lens-top --help >/dev/null
          lens-top --demo --plain --limit 2 >/dev/null
          lens-top --demo --json --limit 2 >/dev/null
          sudo apt-get remove --yes lens-top
          sudo rpm --install --nodeps "dist/${GNU_TARGET}/lens-top-${VERSION}-1.${RPM_ARCH}.rpm"
          lens-top --demo --plain --limit 2 >/dev/null
          sudo rpm --erase lens-top
      - name: Generate CycloneDX SBOM
        run: scripts/generate-sbom.sh "dist/sbom-${{ matrix.name }}"
      - name: Gather release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GNU_TARGET: ${{ matrix.gnu_target }}
          MUSL_TARGET: ${{ matrix.musl_target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "dist/${GNU_TARGET}/lens-top-v${VERSION}-${GNU_TARGET}.tar.gz" release-assets/
          cp "dist/${MUSL_TARGET}/lens-top-v${VERSION}-${MUSL_TARGET}.tar.gz" release-assets/
          cp "dist/${GNU_TARGET}/lens-top_${VERSION}_${DEB_ARCH}.deb" release-assets/
          cp "dist/${GNU_TARGET}/lens-top-${VERSION}-1.${RPM_ARCH}.rpm" release-assets/
          cp dist/sbom-${{ matrix.name }}/*.json release-assets/
      - name: Upload architecture assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error

  assemble:
    name: Assemble and verify release bundle
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download all architecture assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Generate global checksums
        run: |
          cd dist/release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Verify complete bundle
        run: scripts/verify-release.sh dist/release
      - name: Record dry-run result
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          cat > dist/release/DRY-RUN.txt <<EOF_DRY
          Release dry-run succeeded for ${{ needs.prepare.outputs.tag }} at ${{ github.sha }}.
          No GitHub Release was published.
          EOF_DRY
      - name: Upload consolidated release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lens-top-${{ needs.prepare.outputs.tag }}-release-bundle
          path: dist/release/*
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Attest and publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lens-top-${{ needs.prepare.outputs.tag }}-release-bundle
          path: dist/release
      - name: Create GitHub artifact attestations
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/release/*
      - name: Record attestation fallback
        if: steps.attest.outcome != 'success'
        run: |
          cat > dist/release/ATTESTATION-NOTICE.txt <<'EOF_NOTICE'
          GitHub artifact attestations were unavailable for this repository or plan.
          Verify release assets with SHA256SUMS and the included CycloneDX SBOMs.
          EOF_NOTICE
          cd dist/release
          sha256sum ATTESTATION-NOTICE.txt >> SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --title "Dataplicity Lens $RELEASE_TAG" \
            --generate-notes \
            $([[ "$RELEASE_TAG" == *-* ]] && printf '%s' '--prerelease' || true)
