[workspace]
members = [
    "apps/lens-top",
    "crates/core",
    "crates/model",
    "crates/ui",
    "crates/diagnostics",
    "crates/output",
    "crates/platform-linux",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["WildFoundry Ltd"]
repository = "https://github.com/wildfoundry/dataplicity-lens"
homepage = "https://github.com/wildfoundry/dataplicity-lens"

[workspace.dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.23", features = ["derive"] }
crossterm = "0.27.0"
ratatui = "0.26.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
sysinfo = "0.29.11"
thiserror = "1.0.69"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
