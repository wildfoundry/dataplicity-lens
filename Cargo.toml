[workspace]
members = [
    "apps/lens",
    "apps/lens-top",
    "apps/lens-services",
    "apps/lens-logs",
    "apps/lens-disk",
    "apps/lens-net",
    "apps/lens-hardware",
    "apps/lens-system",
    "apps/lens-health",
    "crates/core",
    "crates/model",
    "crates/platform-linux",
    "crates/platform-macos",
    "crates/history",
    "crates/diagnostics",
    "crates/output",
    "crates/ui",
    "crates/system",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["WildFoundry Ltd"]
repository = "https://github.com/wildfoundry/dataplicity-lens"
homepage = "https://lens.dataplicity.com/"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive", "env"] }
clap_complete = "=4.6.8"
clap_mangen = "=0.3.0"
crossterm = "=0.29.0"
indexmap = { version = "=2.14.0", features = ["serde"] }
insta = { version = "=1.48.0", features = ["json"] }
procfs = "=0.18.0"
proptest = "=1.11.0"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros", "serde"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
unicode-width = "=0.2.2"
criterion = { version = "=0.8.2", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
