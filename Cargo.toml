[workspace]
members = [
    "apps/lens-top",
    "crates/core",
    "crates/model",
    "crates/platform-linux",
    "crates/history",
    "crates/diagnostics",
    "crates/output",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["WildFoundry Ltd"]
repository = "https://github.com/wildfoundry/dataplicity-lens"
homepage = "https://github.com/wildfoundry/dataplicity-lens"

[workspace.dependencies]
anyhow = "=1.0.95"
clap = { version = "=4.5.23", features = ["derive", "env"] }
clap_complete = "=4.5.40"
clap_mangen = "=0.2.24"
crossterm = "=0.28.1"
indexmap = { version = "=2.7.0", features = ["serde"] }
insta = { version = "=1.42.0", features = ["json"] }
procfs = "=0.16.0"
proptest = "=1.6.0"
ratatui = "=0.29.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.11"
time = { version = "=0.3.37", features = ["formatting", "macros", "serde"] }
toml = "=0.8.19"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
unicode-width = "=0.2.0"
criterion = { version = "=0.5.1", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
